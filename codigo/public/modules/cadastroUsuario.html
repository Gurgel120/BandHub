<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages/cadastroUsuario.css">
</head>

<body>

    <main class="cadastro">
        <a href="../../index.html" class="cadastro__voltar">
            &larr; Voltar para o início
        </a>

        <section class="cadastro__card">
            <a href="../../index.html" class="cadastro__logo">
                <img src="/public/assets/images/logo.png" alt="BandHub">
            </a>

            <h1 class="cadastro__titulo">Crie sua conta</h1>
            <p class="cadastro__descricao">
                Cadastre-se e descubra novas bandas.
            </p>

            <form class="cadastro__formulario">
                <div class="cadastro__campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name"
                        required>
                </div>

                <div class="cadastro__campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                        required>
                </div>

                <div class="cadastro__campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha"
                        autocomplete="new-password" minlength="8" required>
                    <span class="cadastro__ajuda">
                        Mínimo de 8 caracteres.
                    </span>
                </div>

                <div class="cadastro__campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmarSenha"
                        placeholder="Digite a senha novamente" autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" class="cadastro__botao">
                    Criar conta
                </button>
            </form>

            <p
