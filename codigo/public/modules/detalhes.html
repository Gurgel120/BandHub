<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes | BandHub</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages/detalhes.css">

    <script type="module" src="../assets/js/script.js"></script>
    <script type="module" src="../assets/js/pages/detalhes.js"></script>
</head>

<body>

    <header data-component="header-base"></header>

    <main class="detalhes">

        <a class="detalhes__voltar" href="../../index.html">
            ← Voltar ao catálogo
        </a>

        <section class="banda">

            <div class="banda__imagem-container">
                <img class="banda__imagem" id="imagem-banda" src="" alt="">
            </div>

            <div class="banda__informacoes">

                <span class="banda__etiqueta">BANDA EM DESTAQUE</span>

                <h1 class="banda__nome" id="nome-banda"></h1>

                <p class="banda__descricao" id="descricao-banda"></p>

                <div class="banda__dados">

                    <div class="banda__dado">
                        <span class="banda__dado-label">Gênero musical</span>
                        <span class="banda__dado-valor" id="genero-banda"></span>
                    </div>

                    <div class="banda__dado">
                        <span class="banda__dado-label">Ano de formação</span>
                        <span class="banda__dado-valor" id="ano-banda"></span>
                    </div>

                </div>
            </div>

            <a href="#" id="editar-banda" class="detalhes__editar">
                Editar banda
            </a>

            <button type="button" id="excluir-banda" class="detalhes__excluir">
                Excluir banda
            </button>

        </section>

        <section class="secao">

            <div class="secao__cabecalho">
                <span class="secao__subtitulo">QUEM FAZ A MÚSICA</span>
                <h2 class="secao__titulo">Integrantes</h2>
            </div>

            <div class="integrantes" id="lista-integrantes"></div>

        </section>

        <section class="secao">

            <div class="secao__cabecalho">
                <span class="secao__subtitulo">DISCOGRAFIA</span>
                <h2 class="secao__titulo">Álbuns</h2>
            </div>

            <div class="albuns" id="lista-albuns"></div>

        </section>

    </main>

</body>

</html>
